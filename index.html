<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&family=New+Tegomin&family=Special+Elite&family=Unica+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Horrorhead</title>
</head>
<body>
    <div class="big-container">
        <header><h1>ARE YOU A<br>HORROR HEAD?</h1></header>
        <h2>join us, and<br><i>──── ❝you'll float too❞ ────</i></h2>
        <main>
        <div class="input">
            <input type="text" id="username" placeholder=" Username">
            <input type="password" id="password" placeholder=" Password">
        </div>
        <span class="remember-forgot">
            <div class="remember"><input type="checkbox" id="checkbox"> Remember me</div>
            <p id="forgot">Forgot your password?</p>
        </span>
        <div class="buttons">
            <button id="log-in">Log in</button>
            <button id="new-victim">new victim</button>
        </div>
        <div class="social-buttons">
            <button id="google">log in with Google</button>
            <button id="facebook">log in with Facebook</button>
        </div>
        </main>
        <footer>❝oh yes, there will be blood❞</footer>
    </div>
</body>
</html>
